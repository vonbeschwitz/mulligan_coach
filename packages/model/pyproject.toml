[project]
name = "mulligan-coach-model"
version = "0.0.0"
description = "XGBoost mulligan-recommendation model: training prep, baseline, fit, inference."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bastian von Beschwitz", email = "bastian.vonbeschwitz@gmail.com" }]

dependencies = [
    # Card representation + per-set parsed-card store. Needed to
    # reconstruct (hand, deck) ParsedCard lists from the 17Lands
    # deck_<name> / opening_hand_<name> count columns.
    "mulligan-coach-cards",
    # The simulator -> feature builder pipeline used by feature_matrix.
    # Lives downstream of cards/simulation but is a direct dep here
    # because we own the materialisation step.
    "mulligan-coach-simulation",
    "mulligan-coach-features",
    # DuckDB to query the games view; scikit-learn for the baseline
    # logistic regression + isotonic calibrator; xgboost is the actual
    # predictor; numpy / pandas / pyarrow for the parquet materialisation
    # cache.
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mulligan_coach_model"]
