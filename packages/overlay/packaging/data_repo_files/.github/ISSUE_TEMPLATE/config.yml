# Issue-template chooser config for the PUBLIC data repo.
#
# blank_issues_enabled: keep True so users can still open a free-form
# issue that doesn't fit either template.
blank_issues_enabled: true

# Optional: once the Google Form exists (see the overlay's feedback.py
