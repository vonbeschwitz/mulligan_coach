# mulligan-coach-recommend — shared keep/mulligan recommendation service.
#
# Originally lived inside `packages/website` as
# `mulligan_coach_website.recommendation`; lifted out so both the
# website and the overlay (and the model package's analysis scripts)
# can consume it without depending on FastAPI / Jinja2.
#
# Pure Python — no Qt, no web framework. Composes the upstream
# packages (cards, features, simulation, model) into a single
# entry point: `load_service(set_codes) -> RecommendationService`.

[project]
name = "mulligan-coach-recommend"
version = "0.0.0"
description = "Shared recommendation service: keep / mulligan verdict with prefetch cache and deeper-mulligan floor."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bastian von Beschwitz", email = "bastian.vonbeschwitz@gmail.com" }]

dependencies = [
    # Upstream pipeline packages.
    "mulligan-coach-cards",
    "mulligan-coach-features",
    "mulligan-coach-simulation",
    "mulligan-coach-model",
    # numpy is already a transitive dep of the upstream packages; pinned
    # here too because we use it directly (np.mean over per-sample
    # mulligan predictions).
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mulligan_coach_recommend"]
