[project]
name = "mulligan-coach-simulation"
version = "0.0.0"
description = "Monte Carlo goldfish simulator for the first 4 turns of an MTG Limited game; reports per-card castability stats."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bastian von Beschwitz", email = "bastian.vonbeschwitz@gmail.com" }]

dependencies = [
    # Provides ParsedCard / Mode / Cost / ManaAbility / Predicate / Effect.
    # The simulator never reaches into raw Scryfall — everything is consumed
    # via this package's typed surface.
    "mulligan-coach-cards",
    # Output / log dataclasses (TurnSnapshot, GameTrace, AggregateStats).
    # Pydantic gives us free JSON serialisation when the model package
    # later wants to read these features back from disk.
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mulligan_coach_simulation"]
