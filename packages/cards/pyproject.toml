[project]
name = "mulligan-coach-cards"
version = "0.0.0"
description = "Typed card representation: parsed mana cost, type line, role tags, 17Lands stats, Arena ID."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bastian von Beschwitz", email = "bastian.vonbeschwitz@gmail.com" }]

dependencies = [
    # Anthropic Python SDK — the LLM-based oracle text classifier lives here.
    # Pinned conservatively to a known-stable major.
    "anthropic>=0.45,<1.0",
    # Already used elsewhere in the workspace; pulled in for typed config + the
    # structured-output schema the LLM classifier validates against.
    "pydantic>=2.7",
    # CLI framework (consistent with data-download).
    "typer>=0.12,<1.0",
    # Read 17Lands ratings parquets that data-download wrote.
    "duckdb>=1.1",
    "pyarrow>=17.0",
    # Polite HTTP user-agent for any future direct calls (Scryfall, etc.).
    "httpx>=0.27,<1.0",
]

[project.scripts]
mulligan-coach-cards = "mulligan_coach_cards.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mulligan_coach_cards"]
