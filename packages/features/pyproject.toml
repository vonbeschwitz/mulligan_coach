[project]
name = "mulligan-coach-features"
version = "0.0.0"
description = "Derived per-card and hand-level features over ParsedCard + 17Lands stats."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bastian von Beschwitz", email = "bastian.vonbeschwitz@gmail.com" }]

dependencies = [
    # Provides ParsedCard + SeventeenLandsStats + StatsLookup. Features
    # consume cards via this typed surface only — never reach into raw
    # Scryfall or raw 17Lands parquets.
    "mulligan-coach-cards",
    # Provides AggregateStats: the Monte Carlo output that the simulation
    # feature builder turns into castability / mana-availability features.
    "mulligan-coach-simulation",
    # Used internally by the decile-binning lookup. Already a dep of
    # data-download via duckdb/pyarrow, so no new top-level install.
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mulligan_coach_features"]
