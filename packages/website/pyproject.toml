# mulligan-coach-website — user-facing FastAPI + HTMX app.
#
# Workspace member (see root pyproject.toml's
# `[tool.uv.workspace] members = ["packages/*", "utilities/*"]`). Unlike
# the utilities/ entries (card-viewer, simulation-viewer, dev-site), this
# package is part of the shipped Mulligan Coach recommendation pipeline:
# it's the user-facing surface that takes an Arena decklist + opening hand
# and returns a Keep/Mulligan verdict.
#
# It composes the upstream packages — cards (ParsedCard), features
# (shrunk WR + zscores), simulation (Monte Carlo), model (Recommendation) —
# behind a simple Jinja2-rendered form-and-result page driven by HTMX.

[project]
name = "mulligan-coach-website"
version = "0.0.0"
description = "FastAPI + HTMX web app: paste a deck and a hand, get a keep/mulligan recommendation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bastian von Beschwitz", email = "bastian.vonbeschwitz@gmail.com" }]

dependencies = [
    # The five upstream packages we drive. Resolved against the workspace
    # via the root pyproject's `[tool.uv.sources]` block. `recommend` owns
    # the keep/mulligan service; the website is just a route + template
    # layer over it.
    "mulligan-coach-cards",
    "mulligan-coach-features",
    "mulligan-coach-simulation",
    "mulligan-coach-model",
    "mulligan-coach-recommend",
    # Same web stack the sibling utilities use — keeps the learning
    # surface small. uvicorn[standard] adds the C-accelerated event loop.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    # FastAPI's `Form()` annotations need python-multipart even when the
    # body is form-urlencoded (not multipart). HTMX posts urlencoded.
    "python-multipart>=0.0.9",
    # Pulled in transitively by FastAPI; pinned because we build
    # BaseModel subclasses directly in decklist.py.
    "pydantic>=2.7",
    # Outbound HTTP for the Scryfall card-image proxy. httpx because
    # FastAPI already depends on it; no second client to learn.
    "httpx>=0.27",
]

[project.scripts]
# `uv run mulligan-coach-website` boots the dev server on http://127.0.0.1:8000.
mulligan-coach-website = "mulligan_coach_website.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mulligan_coach_website"]

# Templates and static assets ship with the wheel so importlib.resources
# can locate them at runtime regardless of how the package is installed.
[tool.hatch.build.targets.wheel.force-include]
"src/mulligan_coach_website/templates" = "mulligan_coach_website/templates"
"src/mulligan_coach_website/static" = "mulligan_coach_website/static"
