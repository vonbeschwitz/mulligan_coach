<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Simulation viewer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {# HTMX from CDN. Pinned to v2.x — same version card_viewer uses. #}
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Simulation viewer</a>
    <span class="muted">Mulligan Coach utility</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
