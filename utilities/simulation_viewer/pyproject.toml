# simulation-viewer — local utility for inspecting one Monte Carlo trace.
#
# Workspace member (see root pyproject.toml's
# `[tool.uv.workspace] members = ["packages/*", "utilities/*"]`). Like
# `card-viewer`, this package is a developer tool, not part of the
# shipped recommendation pipeline. It exists in the workspace so it
# shares the `.venv` and can `from mulligan_coach_simulation import ...`
# directly.

[project]
name = "simulation-viewer"
version = "0.0.0"
description = "Local web utility for visualising one Monte Carlo simulation trace turn-by-turn."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bastian von Beschwitz", email = "bastian.vonbeschwitz@gmail.com" }]

dependencies = [
    # The two project packages we drive: cards for the ParsedCard data
    # model, simulation for iter_traces / GameTrace / check_deck_encodings.
    # Resolved against the workspace via the root pyproject's
    # `[tool.uv.sources]` block.
    "mulligan-coach-cards",
    "mulligan-coach-simulation",
    # Same minimal web stack as `card-viewer` — there's no second framework
    # to learn here, and the eventual `website` package will use the same
    # one. uvicorn[standard] adds the C-accelerated event loop.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Server-side templates. Jinja2 is FastAPI's recommended template engine.
    "jinja2>=3.1",
    # Required by FastAPI's `Form()` annotations even when the request
    # body is form-urlencoded (not multipart). Card-viewer doesn't need
    # it because all of its inputs come through query strings; we use
    # POST bodies for the HTMX form, so we need this.
    "python-multipart>=0.0.9",
    # Pulled in transitively by FastAPI; pinned explicitly because we
    # construct BaseModel subclasses directly in decklist.py.
    "pydantic>=2.7",
]

[project.scripts]
# `uv run simulation-viewer` boots the dev server on http://127.0.0.1:8000.
simulation-viewer = "simulation_viewer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulation_viewer"]

# Templates and static assets ship with the wheel so importlib.resources
# can locate them at runtime regardless of how the package is installed.
[tool.hatch.build.targets.wheel.force-include]
"src/simulation_viewer/templates" = "simulation_viewer/templates"
"src/simulation_viewer/static" = "simulation_viewer/static"
