# dev-site — umbrella FastAPI app that mounts the workspace's dev utilities
# under one URL so all of them can be browsed simultaneously on the same port.
#
# Workspace member (see root pyproject.toml's
# `[tool.uv.workspace] members = ["packages/*", "utilities/*"]`). Like
# `card-viewer` and `simulation-viewer`, this is a developer tool, not part of
# the shipped Mulligan Coach recommendation pipeline. It exists in the
# workspace so it shares the project's `.venv` and can import the other
# utilities' FastAPI apps directly.

[project]
name = "dev-site"
version = "0.0.0"
description = "Local FastAPI umbrella that mounts every Mulligan Coach dev utility under one URL."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bastian von Beschwitz", email = "bastian.vonbeschwitz@gmail.com" }]

dependencies = [
    # The utilities we mount. Resolved against the local workspace via the
    # root pyproject's `[tool.uv.sources]` block.
    "card-viewer",
    "simulation-viewer",
    # Same minimal web stack the mounted utilities use — no extra learning
    # surface here. uvicorn[standard] adds the C-accelerated event loop.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Server-side templates for the landing page.
    "jinja2>=3.1",
]

[project.scripts]
# `uv run dev-site` boots the umbrella server on http://127.0.0.1:8000.
dev-site = "dev_site.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_site"]

# Templates and static assets ship with the wheel so importlib.resources
# can locate them at runtime regardless of how the package is installed.
[tool.hatch.build.targets.wheel.force-include]
"src/dev_site/templates" = "dev_site/templates"
"src/dev_site/static" = "dev_site/static"
